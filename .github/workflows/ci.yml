name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-ingestion:
    name: Test auto-geo-ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  test-alerts:
    name: Test auto-geo-alerts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../auto-geo-alerts
    steps:
      - name: Checkout auto-geo-ingestion
        uses: actions/checkout@v4
        with:
          path: auto-geo-ingestion
      - name: Checkout auto-geo-alerts
        uses: actions/checkout@v4
        with:
          repository: duvanweb/auto-geo-alerts
          path: auto-geo-alerts
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: auto-geo-alerts/go.sum
      - name: Build alerts
        working-directory: auto-geo-alerts
        run: go build ./...
      - name: Vet alerts
        working-directory: auto-geo-alerts
        run: go vet ./...

  build-docker:
    name: Validate Docker builds
    runs-on: ubuntu-latest
    needs: [test-ingestion]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ingestion image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auto-geo-ingestion:ci
